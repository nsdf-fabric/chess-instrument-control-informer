# Example: Random sampling from a full reduced JSON file
# This config writes initial random rows into a reduced JSON file, then watches
# for new location files.

source_format: json

full_file: ./data/full_reduced_data.json
new_file: ./output/reduced_data.json

labx_key: labx
labz_key: labz
copy_all_json_keys: true

loc_dir: ./data/exp_01
initial_count: 5
seed: 42
